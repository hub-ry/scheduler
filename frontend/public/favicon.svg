<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Calendar page -->
  <rect x="6" y="12" width="52" height="46" rx="8" fill="#ffffff"/>
  <rect x="6" y="12" width="52" height="46" rx="8" fill="none" stroke="#4f46e5" stroke-width="4"/>
  <!-- Header band, so the mark still reads as a calendar at 16px -->
  <path d="M6 20a8 8 0 0 1 8-8h36a8 8 0 0 1 8 8v6H6z" fill="#4f46e5"/>
  <!-- Binding rings -->
  <rect x="17" y="4" width="6" height="14" rx="3" fill="#312e81"/>
  <rect x="41" y="4" width="6" height="14" rx="3" fill="#312e81"/>
  <!-- Day cells: one picked (the whole point of the app), the rest quiet -->
  <g fill="#c7d2fe">
    <rect x="14" y="33" width="9" height="8" rx="2"/>
    <rect x="41" y="33" width="9" height="8" rx="2"/>
    <rect x="14" y="45" width="9" height="8" rx="2"/>
    <rect x="41" y="45" width="9" height="8" rx="2"/>
  </g>
  <rect x="27.5" y="33" width="9" height="8" rx="2" fill="#4f46e5"/>
  <rect x="27.5" y="45" width="9" height="8" rx="2" fill="#c7d2fe"/>
</svg>
